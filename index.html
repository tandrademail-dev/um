function findBand(totalKm) {
  for (let i = DISTANCE_BENCHMARKS.length - 1; i >= 0; i--) {
    if (totalKm >= DISTANCE_BENCHMARKS[i].minKm) return DISTANCE_BENCHMARKS[i];
  }
  return DISTANCE_BENCHMARKS[0];
}

function addDaysRaw(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

function getBestLongRun(logs, days = 35) {
  const cutoff = addDaysRaw(new Date(), -days);
  let best = null;
  Object.entries(logs || {}).forEach(([key, log]) => {
    if (!log || !log.completed) return;
    if (!key.endsWith("_run") && !key.endsWith("_night")) return;
    const dateStr = key.slice(0, 10);
    if (new Date(dateStr) < cutoff) return;
    if (!log.actualDuration || !log.actualDistance) return;
    if (!best || log.actualDuration > best.actualDuration) best = { ...log, date: dateStr };
  });
  return best;
}

function estimateUltraDistance(logs) {
  const longRun = getBestLongRun(logs);
  if (!longRun) return null;
  const T1 = longRun.actualDuration;
  const D1 = longRun.actualDistance;
  if (!T1 || !D1) return null;
  const k = 1.15;
  const T2 = 1440;
  const totalKm = D1 * Math.pow(T2 / T1, 1 / k);
  return { totalKm, base: longRun };
}

function defaultSkills() {
  const build = (arr) => Object.fromEntries(arr.map((s) => [s.id, 3]));
  return { assessed: false, run: build(SKILL_DEFS.run) };
}
function weakestSkill(skills) {
  const defs = SKILL_DEFS.run;
  const scores = skills?.run || {};
  let weak = defs[0], weakVal = scores[defs[0].id] ?? 3;
  defs.forEach((d) => { const v = scores[d.id] ?? 3; if (v < weakVal) { weak = d; weakVal = v; } });
  return weak;
}
function suggestedDrill(skillId, seed) { const options = DRILLS.run[skillId]; return options[seed % options.length]; }
function defaultExtraSession() { return { enabled: true, day: "wednesday" }; }
function getWeakestPairs(skills) {
  if (!skills?.assessed) return null;
  const all = SKILL_DEFS.run.map((s) => ({ id: s.id, label: s.label, score: skills.run?.[s.id] ?? 3 }));
  all.sort((a, b) => a.score - b.score);
  return all.slice(0, 2);
}
function buildExtraSession(athlete, weekNumber, dateISO) {
  const pairs = getWeakestPairs(athlete.skills);
  if (!pairs) return null;
  const parts = pairs.map((p) => ({ ...p, drill: suggestedDrill(p.id, weekNumber) }));
  const duration = parts.reduce((sum, p) => sum + p.drill.duration, 0);
  const title = `Extra: ${parts.map((p) => p.label).join(" + ")}`;
  const description = parts.map((p) => p.drill.title).join(" · ");
  return { date: dateISO, discipline: "extra", title, duration, intensity: "Opcional", description, parts };
}

// ================= date helpers =================
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfWeek(d) { const r = new Date(d); const day = (r.getDay() + 6) % 7; r.setDate(r.getDate() - day); r.setHours(0,0,0,0); return r; }
function diffWeeks(a, b) { return Math.ceil((b - a) / (7 * 24 * 3600 * 1000)); }
function fmtDate(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "short" }); }
function fmtMin(min) { if (min <= 0) return "—"; const h = Math.floor(min/60), m = Math.round(min%60); return h>0 ? `${h}h${m>0?String(m).padStart(2,"0"):""}` : `${m}min`; }
function fmtKm(km) { if (!km || km<=0) return "—"; return `${km.toFixed(1)}km`; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ================= plan generation =================
// Estrutura de alto volume inspirada em como ultramaratonistas de 24h treinam de facto:
// - regra 80/20 (a maioria do volume é fácil; só uma fatia pequena é a ritmo/limiar)
// - progressão por TEMPO em pé, não por pace — o longo cresce em minutos, não em velocidade
// - back-to-back todos os fins de semana (2º dia com pernas fatigadas é o estímulo mais específico)
// - dias duplos (2 sessões no mesmo dia) na fase de Pico — mais volume total sem alongar
//   demasiado uma única sessão, tal como muitos ultramaratonistas fazem para gerir fadiga
// - força 2x/semana em vez de 1x — durabilidade importa tanto como o VO2
function generatePlan(raceDateISO, todayISO) {
  const today = startOfWeek(new Date(todayISO));
  const race = new Date(raceDateISO + "T00:00:00");
  const totalWeeks = Math.max(10, diffWeeks(today, race));

  const taperWeeks = clamp(Math.round(totalWeeks * 0.08), 2, 3);
  const peakWeeks = Math.max(3, Math.round(totalWeeks * 0.25));
  // Base reduzida ao mínimo: só 2 semanas de adaptação inicial — a partir da semana 3
  // entra-se logo em Construção, com intensidade e volume mais altos desde cedo.
  const baseWeeks = 2;
  const buildWeeks = Math.max(2, totalWeeks - taperWeeks - peakWeeks - baseWeeks);

  const boundaries = [
    { phase: "Base", weeks: baseWeeks },
    { phase: "Build", weeks: buildWeeks },
    { phase: "Peak", weeks: peakWeeks },
    { phase: "Taper", weeks: taperWeeks },
  ];

  const weeks = [];
  let idx = 0;
  for (const block of boundaries) {
    for (let i = 0; i < block.weeks; i++) {
      weeks.push({ index: idx, phase: block.phase, phaseProgress: block.weeks > 1 ? i / (block.weeks - 1) : 1 });
      idx++;
    }
  }

  const grandTotal = weeks.length;
  return weeks.map((w, i) => {
    const globalProgress = clamp(i / Math.max(1, grandTotal - taperWeeks - 1), 0, 1);
    const isCutback = (i + 1) % 4 === 0 && w.phase !== "Taper";
    const isTaper = w.phase === "Taper";
    const taperFactor = isTaper ? lerp(0.6, 0.15, w.phaseProgress) : 1;
    const isNightWeek = (w.phase === "Peak" || (w.phase === "Build" && w.phaseProgress > 0.5)) && (w.index % 3 === 0) && !isCutback && !isTaper;
    // Dia duplo (2ª sessão no mesmo dia) só na fase de Pico, fora de semanas de recuperação —
    // é como os ultramaratonistas ganham volume extra sem alongar excessivamente uma sessão só.
    const isDoubleWeek = (w.phase === "Peak" || (w.phase === "Build" && w.phaseProgress > 0.7)) && !isCutback && !isTaper;

    // Volumes-alvo (minutos) — tetos ainda mais altos, já que a Construção começa na semana 3:
    // longo até 7h30, back-to-back até 3h20, ritmo/limiar até 1h40, fácil até ~1h15.
    let longRun = clamp(lerp(70, 450, globalProgress), 70, 450);
    let run2 = clamp(lerp(30, 200, globalProgress), 30, 200);
    let qualityRun = clamp(lerp(40, 100, globalProgress), 40, 100);
    let easyRun = clamp(lerp(35, 75, globalProgress), 35, 75);
    let doubleAM = clamp(lerp(0, 35, globalProgress), 0, 35);

    if (isTaper) { longRun *= taperFactor/0.6; run2 *= taperFactor/0.6; qualityRun *= taperFactor/0.6 + 0.2; doubleAM = 0; }
    if (isCutback) { longRun *= 0.6; run2 *= 0.65; qualityRun *= 0.75; doubleAM = 0; }

    const strengthMain = w.phase === "Taper" ? 20 : 40;
    const strengthMini = w.phase === "Taper" ? 0 : 18;
    const shakeout = w.phase === "Taper" ? 15 : 20;

    const weekStart = addDays(today, i * 7);
    const dateAt = (off) => toISO(addDays(weekStart, off));

    const qualityDesc = w.phase === "Base"
      ? "Fartlek leve, sem forçar — só para começar a acordar as pernas para ritmo mais rápido."
      : w.phase === "Build"
        ? "Blocos de tempo contínuo (ex: 3x10min Z3 com 3min de trote entre blocos)."
        : "Séries de limiar mais longas (ex: 3x15min Z3 ou fartlek de terreno) — simula gestão de esforço já em fadiga acumulada.";

    const days = [
      { date: dateAt(0), discipline: "rest", title: "Descanso", duration: 0, intensity: "—", description: "Recuperação: mobilidade leve ou nada." },
      { date: dateAt(1), discipline: "run", title: "Corrida fácil + economia", duration: Math.round(easyRun), intensity: "Z1-Z2", description: "Ritmo confortável (80% do volume da semana deve ser assim), foco em cadência e postura." },
      { date: dateAt(2), discipline: "strength", title: "Força + core", duration: Math.round(strengthMain), intensity: "Moderado", description: "Excêntricos de perna, core, estabilidade de anca e tornozelo." },
      { date: dateAt(3), discipline: "run", title: "Corrida com ritmo", duration: Math.round(qualityRun), intensity: "Z2-Z3", description: qualityDesc },
      isDoubleWeek && doubleAM >= 15
        ? { date: dateAt(4), discipline: "run2", title: "Corrida dupla — manhã", duration: Math.round(doubleAM), intensity: "Z1", description: "2ª sessão do dia: fácil e curta, só para somar tempo em pé sem acrescentar fadiga a uma sessão só." }
        : null,
      { date: dateAt(4), discipline: strengthMini > 0 ? "strength" : "run", title: strengthMini > 0 ? "Prehab + mobilidade" : "Shakeout + ativação", duration: strengthMini > 0 ? strengthMini : shakeout, intensity: strengthMini > 0 ? "Leve" : "Z1", description: strengthMini > 0 ? "Sessão curta de prehab (tornozelo, anca, core) — mais frequência, menos volume por sessão." : "Corrida curta e leve para chegar fresco ao fim de semana." },
      isNightWeek
        ? { date: dateAt(5), discipline: "night", title: "Longa noturna — simulação", duration: Math.round(Math.min(longRun,240)), intensity: "Z2 noturno", description: `Começa tarde (22h-23h) — simula a hora crítica da prova. Percurso na pista (${TRACK_LOOP_KM}km/volta) ajuda a treinar a monotonia do loop.` }
        : { date: dateAt(5), discipline: "run", title: "Corrida longa", duration: Math.round(longRun), intensity: "Z2", description: "Prioriza TEMPO em pé, não velocidade — inclui períodos de marcha se for preciso para chegar ao alvo de duração. " + PHASE_META[w.phase].desc },
      { date: dateAt(6), discipline: "run", title: "Corrida longa — back-to-back", duration: Math.round(run2), intensity: "Z2", description: "Pernas já fatigadas do dia anterior — o estímulo mais específico para uma 24h. Pratica aqui o rácio run/walk que vais usar na prova." },
    ].filter(Boolean);

    return { weekNumber: i+1, phase: w.phase, isCutback, isNightWeek, isDoubleWeek, startDate: toISO(weekStart), days };
  });
}

// ================= storage =================
const __hasWindowStorage = typeof window !== "undefined" && !!window.storage;

async function loadKey(key) {
  if (__hasWindowStorage) {
    try {
      const r = await window.storage.get(key, false);
      if (r) return JSON.parse(r.value);
    } catch {}
  }
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
async function saveKey(key, value) {
  if (__hasWindowStorage) {
    try { await window.storage.set(key, JSON.stringify(value), false); } catch {}
  }
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

  loading: true,
  athlete: null,
  plan: [],
  logs: {},
  overrides: {},
  tab: "home",
  weekIdx: 0,
  activeSession: null,
  form: { name: "", raceName: "Ultra Monster", raceDate: "2027-06-01", goalKm: "" },
  expandTech: false,
};
let __registry = {};

function sessionKey(s){ return s.date + "_" + s.discipline; }
function overrideKeyFor(base){ return base.discipline === "extra" ? base.date + "_extra_slot" : base.date + "_" + base.discipline + "_slot"; }

function computeAdaptiveFactor(logs) {
  const entries = Object.entries(logs || {})
    .filter(([k, v]) => v && v.completed && (k.endsWith("_run") || k.endsWith("_night") || k.endsWith("_strength") || k.endsWith("_run2")))
    .map(([k, v]) => ({ date: k.slice(0, 10), rpe: v.rpe }))
    .filter(e => e.rpe)
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 6);
  if (!entries.length) return 1;
  const avgRpe = entries.reduce((s, e) => s + e.rpe, 0) / entries.length;
  if (avgRpe >= 8) return 0.85;
  if (avgRpe >= 7) return 0.93;
  if (avgRpe <= 3.5) return 1.12;
  if (avgRpe <= 4.5) return 1.06;
  return 1;
}

function effectiveSession(base) {
  const key = overrideKeyFor(base);
  const ov = S.overrides[key];
  if (ov) return { ...base, ...ov, __overridden: true, __baseRef: base };
  if (base.discipline !== "rest" && new Date(base.date) > new Date(getToday())) {
    const factor = computeAdaptiveFactor(S.logs);
    if (factor !== 1) return { ...base, duration: Math.max(10, Math.round(base.duration * factor)), __adaptive: factor, __baseRef: base };
  }
  return { ...base, __baseRef: base };
}

function computeWeeklyChartData() {
  const idx = S.weekIdx;
  return S.plan.slice(0, idx+1).map(w => {
    const totals = { week: `S${w.weekNumber}`, corrida: 0, forca: 0 };
    w.days.forEach(d => {
      const eff = effectiveSession(d);
      if (eff.discipline === "run" || eff.discipline === "night" || eff.discipline === "run2") totals.corrida += eff.duration/60;
      if (eff.discipline === "strength") totals.forca += eff.duration/60;
    });
    return totals;
  }).slice(-10);
}

function render() {

  const app = document.getElementById("app");
  document.body.classList.toggle("modal-open", !!S.activeSession);

  if (S.loading) {
    app.innerHTML = `<div class="min-h-screen bg-stone-950 flex items-center justify-center text-stone-500">A carregar…</div>`;

  }

  if (!S.athlete) {
    const f = S.form;
    app.innerHTML = `

  const week = getWeek();
  const today = getToday();

  const todaySession = effDays.find(d => d.date === today);

    const offset = athlete.extraSession.day === "friday" ? 4 : 2;
    const date = week.days[offset]?.date;
    return date ? buildExtraSession(athlete, week.weekNumber, date) : null;
  })() : null;
  const extraSession = extraSessionBase ? effectiveSession(extraSessionBase) : null;
  if (extraSession) __registry[sessionKey(extraSession)] = extraSession;

  const todayMinutes = (() => {
    let total = 0;
    effDays.forEach(d => { if (d.date === today) total += d.duration; });
    if (extraSession && extraSession.date === today) total += extraSession.duration;
    return total;
  })();

  const weekTotalMinutes = effDays.reduce((sum,d) => sum + d.duration, 0);

  const completionRate = (() => {
    if (!week) return 0;
    const relevant = week.days.filter(d => d.discipline !== "rest");

        ${athlete.extraSession?.enabled ? `
        <div class="flex gap-2">
          ${[{id:"wednesday",label:"Quarta"},{id:"friday",label:"Sexta"}].map(d => `

  app.innerHTML = `

  lucide.createIcons();

// ================= chart =================
let __chart = null;
function drawChart() {
  const ctx = document.getElementById("volChart");
  if (!ctx) return;
  const data = computeWeeklyChartData();
  if (__chart) __chart.destroy();
  __chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: data.map(d => d.week),
      datasets: [
        { label: "Corrida", data: data.map(d => d.corrida), backgroundColor: "#fb7185", stack: "a", borderRadius: 4 },
        { label: "Força", data: data.map(d => d.forca), backgroundColor: "#a78bfa", stack: "a" },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, ticks: { color: "#78716c", font: { size: 11 } }, grid: { color: "#292524" } },
        y: { stacked: true, ticks: { color: "#78716c", font: { size: 11 } }, grid: { color: "#292524" } },
      },
      plugins: { legend: { labels: { color: "#a8a29e", font: { size: 11 } } } }
    }
  });
}

// ================= actions =================
function updateGenBtn() {
  const btn = document.getElementById("gen-btn");
  if (btn) btn.disabled = !S.form.name;
}

async function submitOnboarding() {
  if (!S.form.name) return;
  createAthlete({ name: S.form.name, raceName: S.form.raceName, raceDate: S.form.raceDate, goalKm: S.form.goalKm });
}

async function createAthlete(a) {
  const withSkills = {
    ...a,
    goalKm: (a.goalKm === "" || a.goalKm === undefined) ? (S.athlete?.goalKm ?? null) : Number(a.goalKm),
    skills: a.skills || S.athlete?.skills || defaultSkills(),
    extraSession: a.extraSession || S.athlete?.extraSession || defaultExtraSession(),
  };
  S.athlete = withSkills;
  await saveKey("ultramonster:athlete", withSkills);
  S.plan = generatePlan(withSkills.raceDate, toISO(new Date()));
  const idx = S.plan.findIndex(w => new Date(w.startDate) <= new Date(getToday()) && addDays(new Date(w.startDate),6) >= new Date(getToday()));
  S.weekIdx = idx >= 0 ? idx : 0;
  render();
}

function setTab(id) { S.tab = id; render(); }
function changeWeek(delta) { S.weekIdx = clamp(S.weekIdx + delta, 0, S.plan.length - 1); render(); }
function toggleTech() { S.expandTech = !S.expandTech; render(); }

function openSession(key) { S.activeSession = __registry[key]; render(); }
function closeSession() { S.activeSession = null; render(); }

function setActiveDiscipline(disciplineId) {
  if (!S.activeSession) return;
  const m = DISCIPLINE_META[disciplineId];
  const wasRest = S.activeSession.discipline === "rest";
  S.activeSession = {
    ...S.activeSession,
    discipline: disciplineId,
    title: disciplineId === "rest"
      ? "Descanso"
      : (wasRest || S.activeSession.discipline === "rest" ? `${m.label} (extra — não planeado)` : S.activeSession.title),
    intensity: disciplineId === "rest" ? "—" : (S.activeSession.intensity === "—" ? "Z2" : S.activeSession.intensity),
    duration: disciplineId === "rest" ? 0 : (S.activeSession.duration || 45),
    description: disciplineId === "rest" ? "Recuperação: mobilidade leve ou nada." : S.activeSession.description,
  };
  render();
}

async function saveLog() {
  const session = S.activeSession;
  if (!session) return;
  const baseRef = session.__baseRef || session;
  const discipline = session.discipline;
  const overrideKey = overrideKeyFor(baseRef);
  const logKey = session.date + "_" + discipline;

  if (discipline === "rest") {
    const override = { discipline: "rest", title: "Descanso", duration: 0, intensity: "—", elevation: 0, description: "Recuperação: mobilidade leve ou nada." };
    S.overrides = { ...S.overrides, [overrideKey]: override };
    await saveKey("ultramonster:overrides", S.overrides);

    const nextLogs = { ...S.logs };
    ["run", "strength", "night", "run2"].forEach(d => { delete nextLogs[session.date + "_" + d]; });
    S.logs = nextLogs;
    await saveKey("ultramonster:logs", S.logs);

    S.activeSession = null;
    render();
    return;
  }

  const override = {
    discipline,
    title: document.getElementById("ov-title").value,
    duration: Number(document.getElementById("ov-duration").value) || 0,
    intensity: document.getElementById("ov-intensity").value,
    elevation: Number(document.getElementById("ov-elevation").value) || 0,
    description: document.getElementById("ov-description").value,
  };
  S.overrides = { ...S.overrides, [overrideKey]: override };
  await saveKey("ultramonster:overrides", S.overrides);

  const data = {
    completed: true,
    actualDuration: Number(document.getElementById("log-duration").value) || 0,
    actualDistance: Number(document.getElementById("log-distance").value) || 0,
    avgHR: Number(document.getElementById("log-hr").value) || 0,
    rpe: Number(document.getElementById("log-rpe").value) || 0,
    elevationGain: Number(document.getElementById("log-elevation").value) || 0,
    notes: document.getElementById("log-notes").value,
    stravaLink: document.getElementById("log-strava").value,
  };
  S.logs = { ...S.logs, [logKey]: data };
  await saveKey("ultramonster:logs", S.logs);

  S.activeSession = null;
  render();
}

function setSkillScore(id, val) {
  const skills = S.athlete.skills || defaultSkills();
  const next = { ...skills, assessed: true, run: { ...skills.run, [id]: val } };
  createAthlete({ ...S.athlete, skills: next });
}

function toggleExtraEnabled() {
  createAthlete({ ...S.athlete, extraSession: { ...S.athlete.extraSession, enabled: !S.athlete.extraSession?.enabled } });
}
function setExtraDay(id) {
  createAthlete({ ...S.athlete, extraSession: { ...S.athlete.extraSession, day: id } });
}

function exportData() {
  const payload = {
    kind: "ultramonster-backup",
    exportedAt: new Date().toISOString(),
    athlete: S.athlete,
    logs: S.logs,
    overrides: S.overrides,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ultra-monster-dados-${toISO(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importDataFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (payload.athlete) {
      S.athlete = { ...payload.athlete, skills: payload.athlete.skills || defaultSkills(), extraSession: payload.athlete.extraSession || defaultExtraSession() };
      await saveKey("ultramonster:athlete", S.athlete);
    }
    if (payload.logs) { S.logs = payload.logs; await saveKey("ultramonster:logs", S.logs); }
    if (payload.overrides) { S.overrides = payload.overrides; await saveKey("ultramonster:overrides", S.overrides); }
    if (S.athlete) {
      S.plan = generatePlan(S.athlete.raceDate, toISO(new Date()));
      const idx = S.plan.findIndex(w => new Date(w.startDate) <= new Date(getToday()) && addDays(new Date(w.startDate),6) >= new Date(getToday()));
      S.weekIdx = idx >= 0 ? idx : 0;
    }
    input.value = "";
    render();
  } catch (e) {
    alert("Não consegui ler este ficheiro. Confirma que é um export do Ultra Monster (.json).");
  }
}
function updateRaceDate(val) { createAthlete({ ...S.athlete, raceDate: val }); }
function updateGoalKm(val) { createAthlete({ ...S.athlete, goalKm: val === "" ? null : Number(val) }); }
function setWeight(w) { createAthlete({ ...S.athlete, weight: w }); }
function setStravaProfile(url) { createAthlete({ ...S.athlete, stravaProfile: url }); }

async function resetAll() {
  S.athlete = null; S.plan = []; S.logs = {}; S.overrides = {};
  await saveKey("ultramonster:athlete", null);
  await saveKey("ultramonster:logs", null);
  await saveKey("ultramonster:overrides", null);
  render();
}

// ================= init =================
(async function init() {
  const a = await loadKey("ultramonster:athlete");
  const l = await loadKey("ultramonster:logs");
  const o = await loadKey("ultramonster:overrides");
  if (o) S.overrides = o;
  if (a) {
    const merged = { ...a, skills: a.skills || defaultSkills(), extraSession: a.extraSession || defaultExtraSession() };
    S.athlete = merged;
    S.plan = generatePlan(merged.raceDate, toISO(new Date()));
    const idx = S.plan.findIndex(w => new Date(w.startDate) <= new Date(getToday()) && addDays(new Date(w.startDate),6) >= new Date(getToday()));
    S.weekIdx = idx >= 0 ? idx : 0;
  }
  if (l) S.logs = l;
  S.loading = false;
  render();
})();
</script>
</body>
